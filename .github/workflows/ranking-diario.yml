name: Atualizar ranking diário do Brasileirão

on:
  schedule:
    - cron: "0 9 * * *" # 06h00 no horário de Brasília (UTC-3)
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/atualizar_ranking.py"
      - ".github/workflows/ranking-diario.yml"

permissions:
  contents: read

concurrency:
  group: ranking-brasileirao-2026
  cancel-in-progress: false

jobs:
  atualizar-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin

      - name: Calcular e publicar Top 10
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BRASILEIRAO_API_URL: https://cold-sbrasileirao-predictor-apiilence-07ef.jrnischjr.workers.dev/
        run: python scripts/atualizar_ranking.py
