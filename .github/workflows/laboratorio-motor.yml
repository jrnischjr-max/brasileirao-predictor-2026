name: Laboratório estatístico do motor 2.0

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/laboratorio_motor.py"
      - ".github/workflows/laboratorio-motor.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  laboratorio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: false

      - name: Executar laboratório temporal
        env:
          BRASILEIRAO_API_URL: https://cold-sbrasileirao-predictor-apiilence-07ef.jrnischjr.workers.dev/
          SEASON: "2025"
        run: python scripts/laboratorio_motor.py

      - name: Publicar relatório e dados
        uses: actions/upload-artifact@v4
        with:
          name: laboratorio-motor-2-0
          path: laboratorio-output/
          if-no-files-found: error
          retention-days: 30
