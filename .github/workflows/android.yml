name: Construir Brasileirão Predictor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Secret KEYSTORE_BASE64 não configurado" && exit 1)
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/brasileirao-release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/brasileirao-release.jks" >> "$GITHUB_ENV"

      - name: Compilar aplicativo assinado
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || (echo "Secret KEYSTORE_PASSWORD não configurado" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Secret KEY_ALIAS não configurado" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Secret KEY_PASSWORD não configurado" && exit 1)
          gradle :app:assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Brasileirao-Predictor-APK
          path: app/build/outputs/apk/debug/app-debug.apk
